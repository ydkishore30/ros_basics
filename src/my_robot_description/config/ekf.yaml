ekf_filter_node:
  ros__parameters:
    frequency: 30.0   # was 50 - Pi 4 could not keep up with Nav2 running (631 missed-rate errors)
    two_d_mode: true
    publish_tf: true
    # Future-date odom->base_footprint so /scan stamps never land just past the
    # latest TF ("Lookup would require extrapolation into the future" in RViz/SLAM).
    transform_time_offset: 0.05

    odom0: /diff_drive_controller/odom

    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    # Heading comes from the IMU gyro only. Wheel yaw / yaw rate are NOT fused:
    # the encoders intermittently under-count turns (measured 30 deg reported
    # for a 59 deg turn), which jumped the odom heading past SLAM's 20 deg
    # search window and drew the room twice. Gyro z matched IMU heading in every test.
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    # Fuse wheel odom as pose deltas, not absolute pose — otherwise
    # /set_pose is immediately overridden by diff_drive's own running total.
    odom0_differential: true

    imu0: /imu

    # BNO provides: yaw (orientation z), angular velocity z
    # IMU yaw orientation disabled — fuse only yaw rate from IMU
    # Do NOT fuse roll/pitch in 2D mode (they conflict with two_d_mode constraint)
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    world_frame: odom
    odom_frame: odom
    base_link_frame: base_footprint

    print_diagnostics: true