name: Build and Push ROS 2 Multi-Arch Images

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # PC IMAGE (linux/amd64) — native execution, fast
  # ============================================================
  build-pc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PC image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: TARGETARCH=amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ros_basics:pc
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # ============================================================
  # PI IMAGE (linux/arm64) — QEMU emulation, runs in parallel
  # ============================================================
  build-pi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Pi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: TARGETARCH=arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ros_basics:pi
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
